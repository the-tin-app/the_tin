# The five non-iOS suites, on every pull request. The iOS suite is deliberately absent:
# it needs a macOS runner and a signed simulator build, which is minutes of paid runner
# time per push for a hobby project. Run it locally with ⌘U before promoting.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  node:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [functions, catalog-server, workers/tin-backup]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm test

  site:
    # No package.json and no dependencies — node's own test runner over two .mjs files.
    # The glob is expanded by the shell, not by node: `node --test <dir>` and node-side
    # globbing both vary by node version, and an unquoted glob works on all of them.
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.mjs
        working-directory: site

  fingerprint:
    # Python 3.11 pinned, not "3.x": opencv-python-headless==4.9.0.80 has no wheel for
    # newer Pythons and building it from source on a runner is not viable.
    name: fingerprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: fingerprint
      - run: pytest -q
        working-directory: fingerprint
