name: TheTin
options:
  bundleIdPrefix: ai.reyes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # iPhone + iPad. The App Store listing has carried 12.9" iPad screenshots since 1.0 while the
    # binary was iPhone-only — a store page promising something the build didn't have, on an app
    # Apple has already rejected once. Deliberately NO NavigationSplitView adaptation: a
    # stretched-but-native iPhone layout is a respectable thing to ship, and a second layout is a
    # maintenance cost forever.
    TARGETED_DEVICE_FAMILY: "1,2"
    # The App Store version. A train closes for new build submissions the MOMENT its version goes
    # READY_FOR_SALE — 1.0 closed at build 27, and 1.0.1 closed on 2026-08-03 when it was approved.
    # So this is load-bearing, not decorative: bump it for each App Store release, and check
    # /v1/apps/<id>/appStoreVersions before an upload rather than trusting a note. Build 30 failed
    # export against a closed 1.0.1 train for exactly that reason. 1.0.2 closed on 2026-08-09,
    # and 1.0.3 on 2026-08-14 — verified via appStoreVersions immediately before that bump
    # (READY_FOR_SALE / READY_FOR_DISTRIBUTION), not from this comment.
    #
    # ⚠️ 1.0.5 breaks that pattern and the reason matters. It was set on 2026-08-17 while 1.0.4 was
    # still WAITING_FOR_REVIEW (verified via appStoreVersions, not assumed) — so unlike every bump
    # above, the previous train is still OPEN. That is deliberate: `staging` stays at 1.0.4 so a
    # review fix can still be cut against that open train, and this branch (staging-1.0.5) carries
    # the next one. Two consequences, both of which bite at export rather than upload:
    #   - No 1.0.5 appStoreVersion record exists yet. Create one before uploading from here.
    #   - When 1.0.4 does go READY_FOR_SALE, `staging` is closed — anything still to ship moves here.
    MARKETING_VERSION: 1.0.5
    CURRENT_PROJECT_VERSION: 1
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Gzip:
    url: https://github.com/1024jp/GzipSwift
    from: 6.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  OpenCV:
    url: https://github.com/yeatse/opencv-spm
    exactVersion: 4.9.0
targets:
  TheTin:
    type: application
    platform: iOS
    sources:
      - path: TheTin/Sources
      - path: TheTin/Assets.xcassets
      - path: TheTin/Resources
    # GoogleService-Info.plist is gitignored (bring your own Firebase project). Copied into
    # the bundle only if present so a fresh clone builds with no Firebase config at all.
    postBuildScripts:
      - name: Copy GoogleService-Info.plist (if present)
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${SRCROOT}/TheTin/GoogleService-Info.plist"
          if [ -f "$PLIST" ]; then
            cp "$PLIST" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
          fi
      # Uploads dSYMs so Crashlytics reports arrive symbolicated. Without this a review-device
      # crash lands as raw addresses — useless, which is the whole reason Crashlytics is here.
      # No-ops when the SDK isn't checked out yet (fresh clone, first resolve).
      - name: Upload Crashlytics dSYMs
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        script: |
          RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -f "$RUN" ]; then "$RUN"; fi
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Gzip
        product: Gzip
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseCrashlytics
      - package: OpenCV
        product: OpenCV
      - target: TheTinWidgets
    info:
      path: TheTin/Info.plist
      properties:
        CFBundleDisplayName: The Tin
        # Reference the build setting instead of a baked literal so deploy-testflight.sh's
        # per-run CURRENT_PROJECT_VERSION=<n> override actually reaches the bundle.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Same reason, and it fixes a real trap: without this key XcodeGen writes its OWN default
        # of "1.0" into the generated Info.plist, which is why MARKETING_VERSION appeared to be a
        # dead setting — nothing wired it to the bundle. Editing the generated plist by hand does
        # not work either, because deploy-testflight.sh runs `xcodegen generate` first and
        # overwrites it. Bump MARKETING_VERSION above; this carries it through.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        # Lets a .csv be sent to The Tin from Files, AirDrop or a share sheet. Without this the
        # app declares no document types at all, so a exported collection showed "no apps
        # available" on the receiving device (2026-07-27). Viewer/Alternate: we read a CSV and
        # import it, we don't own or edit the file, so we must not outrank a spreadsheet app.
        # Handled in AppModel.handleDeepLink — declaring a type without handling the URL would
        # make "Open in The Tin" launch the app and do nothing, which is worse than not appearing.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comma-Separated Values
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text]
        # REQUIRED once CFBundleDocumentTypes exists — App Store Connect rejected build 24's
        # delivery report with ITMS-90737 without it. The rule is about DECLARING document types,
        # not about editing them: an app that only reads a file still has to say which model it
        # uses. (Build 24 still shipped; ITMS-90737 is a warning, not a failed upload.)
        #
        # `true`, the recommended value, and the one that matches the code: we're handed the
        # original file's security-scoped URL, which `SettingsView.runImport` already wraps in
        # start/stopAccessingSecurityScopedResource. `false` would have iOS copy every opened CSV
        # into Documents/Inbox, and nothing in the app ever cleans that up.
        #
        # This does NOT expose the app's Documents folder in Files — that's UIFileSharingEnabled,
        # which stays off.
        LSSupportsOpeningDocumentsInPlace: true
        # ⚠️ **`UIRequiresFullScreen` is DEPRECATED and no longer a reliable opt-out.** It was true
        # while the app was built against older SDKs; this project now builds with Xcode 26 /
        # iOS SDK 26, and in iPadOS 26 an app linked against that SDK is freely resizable whatever
        # this key says. So the long-standing assumption behind "deliberately no NavigationSplitView
        # adaptation" — that the app only ever renders at one width per device — has a hole in it,
        # and nothing in the codebase reads a size class (0 occurrences in 31k lines of Swift).
        #
        # ✅ **VERIFIED 2026-08-11 on an iPadOS 26 simulator (iPad Pro 11" M4, 834 pt portrait)** —
        # this block used to end "expected to degrade gracefully rather than break. **Expected, not
        # verified.**" It is verified now, and the expectation was RIGHT about layout and WRONG
        # about chrome:
        #
        # - **Layout holds.** Discover's shelves reflow to the wider width, the tin's dividers and
        #   rows lay out correctly, and the For You sheet presents as a proper centred form sheet.
        #   Nothing reads as a stretched phone. The app also picks up **iPadOS 26's floating top
        #   tab bar for free**, because it uses a stock `TabView`.
        # - **Measured, so the width axis needs no size class:** the widest fixed container in
        #   `Sources/UI` outside `UI/Print/` is **126 pt** (`ReportPages` photo tile); every card
        #   grid is `GridItem(.adaptive(minimum: 110))` or `.flexible(maximum:)`, and every other
        #   wide constraint is a `maxWidth` CAP (700 pt on the tin column) which never demands
        #   width. A narrow window therefore degrades toward the 375 pt phone layout that
        #   `DiscoverFeedbackTests` and `LabelSheetTests` already pin.
        # - ⚠️ **One real bug, and only iPadOS 26 could show it:** the banners in `FundingBanner`'s
        #   top `safeAreaInset` painted the entire top safe area, because `background(_:)` defaults
        #   to `ignoresSafeAreaEdges: .all`. On iPhone the nav bar fills that region so nothing
        #   showed — for the app's whole life. With the tab bar floating at the top instead, the
        #   yellow `ReducedDataBanner` became a full-bleed header behind the status bar and the tab
        #   pills. Fixed with `ignoresSafeAreaEdges: []` on all three; see `RootView.swift`.
        #
        # ⚠️ **STILL UNVERIFIED: landscape.** The orientation lock below is unchanged, deliberately.
        # Unlocking it is a shipped-behaviour change that wants a walk through every screen in
        # landscape, and this environment cannot rotate the simulator (Simulator has no
        # accessibility permission to receive the ⌘← keystroke). See
        # `docs/testing/ipad-resizable-window.md` — it is Tomas's call, with the evidence above.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan your cards to identify them and add to your collection.
        NSPhotoLibraryUsageDescription: Attach your own photos of a card to its entry, for insurance records.
        # Permits cleartext HTTP to private/link-local addresses only — used by DEBUG builds to
        # reach a LAN dev catalog-server (APP_ATTEST_ENVIRONMENT=development) via SELFHOST_URL.
        # Inert in release: the production app only ever talks to https://apithetin.reyes.ai.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Opportunistic background catalog refresh (wishlist price alerts spec 2026-07-14).
        # "fetch" backs the BGAppRefreshTask manifest check; "processing" backs the
        # BGProcessingTask tiered download. Best-effort — iOS schedules these when it likes.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - ai.reyes.thetin.catalog-refresh
          - ai.reyes.thetin.catalog-download
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.reyes.thetin
        CODE_SIGN_ENTITLEMENTS: TheTin/TheTin.entitlements
        DEVELOPMENT_TEAM: GXP2X83CRN
        SWIFT_OBJC_BRIDGING_HEADER: TheTin/TheTin-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
      configs:
        # Release archives sign manually: xcodebuild cloud signing (-allowProvisioningUpdates)
        # auth-fails on this machine, so profiles are created via the ASC API and installed
        # locally (see docs/HANDOFF.md). Debug stays automatic for run-on-device.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "The Tin App Store"
          # Explicit, not inherited: Crashlytics can only symbolicate what the dSYM upload
          # phase above finds, and that phase finds nothing without dSYMs.
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  TheTinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TheTin/Tests
      - path: TheTin/Resources/codebook.bin
    dependencies:
      - target: TheTin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TheTinWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TheTinWidgets/Sources
      # Shared app↔widget file(s): the app target already compiles this via its whole-directory
      # `TheTin/Sources` entry; listing the subdirectory here compiles the same files into the
      # extension. Keep this directory Foundation-only.
      - path: TheTin/Sources/Shared
    info:
      path: TheTinWidgets/Info.plist
      properties:
        CFBundleDisplayName: The Tin
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Must MATCH the host app's version or the upload is rejected — an extension may not
        # differ from the app that contains it. Without this key XcodeGen writes its own "1.0"
        # default here, which silently diverges the moment the app's version moves.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.reyes.thetin.TheTinWidgets
        CODE_SIGN_ENTITLEMENTS: TheTinWidgets/TheTinWidgets.entitlements
        DEVELOPMENT_TEAM: GXP2X83CRN
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "The Tin Widgets App Store"
schemes:
  TheTin:
    build:
      targets:
        TheTin: all
    test:
      targets:
        - TheTinTests
